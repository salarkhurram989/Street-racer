<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#05070a"><title>STREET RACER — SALARX 3D DRIVE</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font:14px Arial,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#brand{position:absolute;top:16px;left:16px;font-weight:1000;letter-spacing:3px;font-size:16px}#stats{position:absolute;top:16px;right:16px;text-align:right;background:#060b11c9;border:1px solid #ffffff2b;border-radius:12px;padding:10px 14px;min-width:115px}#speed{font-size:30px;font-weight:1000}#hint{position:absolute;top:90px;left:16px;background:#060b11b9;padding:9px 12px;border-radius:9px;font-size:11px}#bottom{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}button{border:1px solid #ffffff70;background:#0b131de8;color:white;border-radius:50%;width:68px;height:68px;font-weight:900;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none;-webkit-tap-highlight-color:transparent}button.nitro{background:#e3a72c;color:#101010;border-radius:16px;width:82px;font-size:15px}button.back{border-radius:10px;width:auto;height:auto;padding:10px 13px;font-size:11px;position:absolute;right:16px;top:72px}button.active{background:#e3a72c;color:#101010;transform:scale(.96)}@media(min-width:800px){#bottom{opacity:.65}#hint{font-size:12px}}@media(max-width:600px){#bottom{padding:0 8px;bottom:max(14px,env(safe-area-inset-bottom));gap:6px;align-items:center}#bottom button{width:clamp(46px,12.5vw,64px);height:clamp(46px,12.5vw,64px);font-size:20px;flex-shrink:1}#bottom button.nitro{width:clamp(62px,17vw,78px);font-size:12px;border-radius:14px}#hint{max-width:68%;line-height:1.45}#brand{top:max(12px,env(safe-area-inset-top));left:12px;font-size:14px}#stats{top:max(12px,env(safe-area-inset-top));right:10px;padding:8px 10px;min-width:95px}#speed{font-size:25px}}
</style></head><body><div id="hud"><div id="brand">STREET RACER <span style="color:#ffbf00">/ 3D</span><div style="font-size:9px;color:#aab7c3;letter-spacing:3px;margin-top:5px">SALARX RACING</div></div><div id="stats"><div id="speed">000</div><small>KM/H</small><div style="margin-top:5px">DIST <b id="dist">0</b> m</div><div>BEST <b id="best">0</b> m</div></div><div id="hint">W / ↑ accelerate · S / ↓ brake · A/D steer · SPACE nitro<br>Mobile: use the on-screen controls</div><button class="back" id="back">2D GARAGE</button><div id="bottom"><button data-key="a">◀</button><button data-key="s">▼</button><button class="nitro" data-key=" ">NITRO</button><button data-key="w">▲</button><button data-key="d">▶</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x829db3);scene.fog=new THREE.Fog(0x829db3,35,170);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,260);camera.position.set(0,5.5,11);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf4ff,0x293a30,1.8));const sun=new THREE.DirectionalLight(0xffe7c2,3);sun.position.set(-10,20,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x30363d,.92),line=mat(0xf0f1e9),grass=mat(0x355c3a),glass=mat(0x142c3d,.25,.2);
function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
mesh(new THREE.PlaneGeometry(200,260),grass,0,-.3,-90).rotation.x=-Math.PI/2;
mesh(new THREE.PlaneGeometry(15,260),asphalt,0,-.1,-90).rotation.x=-Math.PI/2;
for(let x of [-6.9,6.9])mesh(new THREE.BoxGeometry(.16,.025,260),line,x,.01,-90);
const dashes=[];for(let z=-210;z<30;z+=9){dashes.push(mesh(new THREE.BoxGeometry(.16,.025,4),line,0,.02,z))}
const buildings=[];for(let i=0;i<52;i++){let side=i%2?1:-1,z=-i*5.5-12,h=4+Math.random()*16,w=3+Math.random()*5;const b=mesh(new THREE.BoxGeometry(w,h,4+Math.random()*5),mat([0x53616d,0x727b82,0x3c4a57,0x8a8278][i%4]),side*(11+Math.random()*10),h/2-.1,z);buildings.push(b);for(let j=0;j<Math.floor(h/2);j++)for(let k=0;k<2;k++)mesh(new THREE.BoxGeometry(.42,.5,.03),mat(0x9bc5d8,.35),b.position.x+(k?1:-1)*w*.2,j*1.5+1,b.position.z-2.03)}
// streetlights
for(let z=-180;z<15;z+=18)for(let side of [-1,1]){mesh(new THREE.CylinderGeometry(.07,.1,5,8),mat(0x313942),side*8,2.5,z);mesh(new THREE.BoxGeometry(1.2,.12,.35),mat(0xffe9b0,.3),side*8,5,z)}
function makeCar(color){const g=new THREE.Group();scene.add(g);mesh(new THREE.BoxGeometry(1.65,.48,3.2),mat(color,.32,.35),0,.65,0,g);mesh(new THREE.BoxGeometry(1.2,.55,1.45),glass,0,1.12,-.18,g);mesh(new THREE.BoxGeometry(1.3,.12,.45),mat(0x14191e,.3),0,.95,1.15,g);for(let x of [-.86,.86])for(let z of [-1,1]){const w=mesh(new THREE.CylinderGeometry(.31,.31,.18,16),mat(0x090b0e,.85),x,.35,z,g);w.rotation.z=Math.PI/2}for(let x of [-.52,.52]){mesh(new THREE.BoxGeometry(.28,.12,.05),mat(0xf8f3df,.2),x,.73,-1.61,g);mesh(new THREE.BoxGeometry(.28,.12,.05),mat(0xff302a,.2),x,.73,1.61,g)}return g}
const car=makeCar(0xd92635);car.position.set(0,0,5);
const traffic=[];for(let i=0;i<7;i++){const t=makeCar([0x2876c7,0xe0e1e2,0x22272d,0xc69b3c][i%4]);t.scale.setScalar(.88);t.position.set([-4.5,-1.5,1.5,4.5][i%4],0,-24-i*24);traffic.push({mesh:t,speed:12+Math.random()*13})}
const keys={};const blockedCodes=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyN']);function keyDown(e){if(blockedCodes.has(e.code)){e.preventDefault();e.stopPropagation()}keys[e.key.toLowerCase()]=true;if(e.code==='ArrowUp'||e.code==='KeyW')keys.accelerate=true;if(e.code==='ArrowDown'||e.code==='KeyS')keys.brake=true;if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='KeyN')keys.nitro=true}function keyUp(e){if(blockedCodes.has(e.code)){e.preventDefault();e.stopPropagation()}keys[e.key.toLowerCase()]=false;if(e.code==='ArrowUp'||e.code==='KeyW')keys.accelerate=false;if(e.code==='ArrowDown'||e.code==='KeyS')keys.brake=false;if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'||e.code==='KeyN')keys.nitro=false}addEventListener('keydown',keyDown,{passive:false});addEventListener('keyup',keyUp,{passive:false});addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('active'))});document.addEventListener('visibilitychange',()=>{if(document.hidden){Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('active'))}});['copy','cut','paste','contextmenu','selectstart','dragstart'].forEach(type=>document.addEventListener(type,e=>{e.preventDefault();e.stopPropagation()}));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();e.stopPropagation();try{b.setPointerCapture(e.pointerId)}catch(_){}keys[k]=true;b.classList.add('active')};const up=e=>{e.preventDefault();e.stopPropagation();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down,{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(type=>b.addEventListener(type,up,{passive:false}));b.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation()},{passive:false});b.addEventListener('touchstart',e=>{e.preventDefault()},{passive:false});b.addEventListener('dragstart',e=>e.preventDefault())});
document.getElementById('back').onclick=()=>location.href='./index.html';
let speed=0,dist=0,best=Number(localStorage.salarx3dBest||0),last=performance.now(),steer=0,nitro=100;document.getElementById('best').textContent=best;
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000||.016);last=now;
const accel=keys.accelerate||keys.w||keys.arrowup,brake=keys.brake||keys.s||keys.arrowdown,boost=keys.nitro||keys[' ']||keys.n;speed+=accel?22*dt: -7*dt;if(brake)speed-=30*dt;if(boost&&nitro>0){speed+=36*dt;nitro=Math.max(0,nitro-26*dt)}else nitro=Math.min(100,nitro+8*dt);speed=Math.max(0,Math.min(58,speed));const turn=(keys.left||keys.a||keys.arrowleft?-1:0)+(keys.right||keys.d||keys.arrowright?1:0);steer+=(turn-steer)*Math.min(1,dt*4);car.position.x=Math.max(-5.5,Math.min(5.5,car.position.x+steer*speed*.11*dt));car.rotation.z=-steer*.08*Math.min(1,speed/20);const move=speed*dt*.85;dist+=move;document.getElementById('speed').textContent=String(Math.round(speed*4.1)).padStart(3,'0');document.getElementById('dist').textContent=Math.floor(dist);if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.salarx3dBest=best;document.getElementById('best').textContent=best}
for(const d of dashes){d.position.z+=move;if(d.position.z>12)d.position.z-=234}
for(const b of buildings){b.position.z+=move;if(b.position.z>16)b.position.z-=286}
for(const t of traffic){t.mesh.position.z+=move-(t.speed*dt*.4);if(t.mesh.position.z>12){t.mesh.position.z=-150-Math.random()*40;t.mesh.position.x=[-4.5,-1.5,1.5,4.5][Math.floor(Math.random()*4)]}if(Math.abs(t.mesh.position.z-car.position.z)<2.4&&Math.abs(t.mesh.position.x-car.position.x)<1.45&&speed>3){speed*=.965}}
camera.position.x+=(car.position.x*.55-camera.position.x)*Math.min(1,dt*3);camera.position.z=car.position.z+8.5;camera.position.y=5.2+speed*.008;camera.lookAt(car.position.x*.35,1,-10);renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
